{% extends "base.html" %}
{% block title %}Staff Login – SmartConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card sc-card p-4 bg-white">
      <h4 class="fw-bold mb-1">Staff Login</h4>
      <p class="text-muted small mb-3">Admin, Host, and Security Guard portal</p>
      {% if error %}
        <div class="alert alert-danger small">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-dark w-100 fw-semibold">Sign In</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
